{% macro render_field(field) %}
<div class="form-group">
    {% if field.type == "BooleanField" %}
        <label>
            {{ field() }} {{ field.label.text }}
        </label>
    {% else %}
        {{ field.label }}
        {{ field(class="form-control") }}
    {% endif %}

    {% if field.errors %}
        <ul class="errors">
        {% for error in field.errors %}
            <li>{{ error }}</li>
        {% endfor %}
        </ul>
    {% endif %}
</div>
{% endmacro %}
