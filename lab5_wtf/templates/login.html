{% extends "base.html" %}
{% from "_macros.html" import render_field %}

{% block content %}
<h2>Login</h2>

<form method="POST" novalidate>
    {{ form.csrf_token }}

    {{ render_field(form.username) }}
    {{ render_field(form.password) }}
    {{ render_field(form.remember) }}

    {{ form.submit(class="btn") }}
</form>

{% endblock %}
